name: Backend validation

on:
  push:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/backend.yml'
      - 'benchmarks/engine_fixture/**'
      - 'benchmarks/slither_fixture/**'
      - 'render_start.sh'
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/backend.yml'
      - 'benchmarks/engine_fixture/**'
      - 'benchmarks/slither_fixture/**'
      - 'render_start.sh'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Foundry
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://foundry.paradigm.xyz | bash
          export PATH="$HOME/.config/.foundry/bin:$PATH"
          for attempt in 1 2 3; do
            if foundryup; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Foundry installation failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          forge --version
          echo "$HOME/.config/.foundry/bin" >> "$GITHUB_PATH"
      - name: Install Solidity compiler used by fixture
        run: |
          solc-select install 0.8.20
          solc-select use 0.8.20
      - name: Verify mature security engines
        run: |
          slither --version
          forge --version
          halmos --version
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run production engine self-test
        run: python scripts/live_engine_self_test.py
      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q
