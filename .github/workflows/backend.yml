name: Backend validation

on:
  push:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/backend.yml'
      - 'benchmarks/engine_fixture/**'
      - 'benchmarks/slither_fixture/**'
      - 'benchmarks/protocol_fixtures/**'
      - 'render_start.sh'
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/backend.yml'
      - 'benchmarks/engine_fixture/**'
      - 'benchmarks/slither_fixture/**'
      - 'benchmarks/protocol_fixtures/**'
      - 'render_start.sh'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Foundry
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://foundry.paradigm.xyz | bash
          export PATH="$HOME/.config/.foundry/bin:$PATH"
          for attempt in 1 2 3; do
            if foundryup; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "Foundry installation failed after 3 attempts" >&2; exit 1; fi
            sleep $((attempt * 5))
          done
          forge --version
          echo "$HOME/.config/.foundry/bin" >> "$GITHUB_PATH"
      - name: Install ItyFuzz
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/ityfuzz-installer.sh" https://ity.fuzz.land/
          bash "$RUNNER_TEMP/ityfuzz-installer.sh"
          if [ -f "$HOME/.bashrc" ]; then source "$HOME/.bashrc"; fi
          export PATH="$HOME/.ityfuzz/bin:$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          if ! command -v ityfuzzup >/dev/null 2>&1; then
            ityfuzzup_path="$(find "$HOME" -type f -name ityfuzzup -perm -u+x 2>/dev/null | head -n 1 || true)"
            if [ -n "$ityfuzzup_path" ]; then export PATH="$(dirname "$ityfuzzup_path"):$PATH"; fi
          fi
          if ! command -v ityfuzzup >/dev/null 2>&1; then echo "ityfuzzup was not found" >&2; exit 1; fi
          ityfuzzup
          found="$(find "$HOME" "$RUNNER_TEMP" -type f -name ityfuzz -perm -u+x 2>/dev/null | head -n 1 || true)"
          if [ -z "$found" ]; then echo "ItyFuzz installation failed" >&2; exit 1; fi
          mkdir -p "$RUNNER_TEMP/ityfuzz/bin"
          install -m 0755 "$found" "$RUNNER_TEMP/ityfuzz/bin/ityfuzz"
          echo "$RUNNER_TEMP/ityfuzz/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ityfuzz/bin/ityfuzz" --version
      - name: Install OSV-Scanner and Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/osv-scanner" 'https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64'
          echo '15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  '"$HOME/.local/bin/osv-scanner" | sha256sum -c -
          chmod +x "$HOME/.local/bin/osv-scanner"
          curl -fsSL -o "$HOME/.local/bin/gitleaks.tar.gz" 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$HOME/.local/bin/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$HOME/.local/bin/gitleaks.tar.gz" -C "$HOME/.local/bin" gitleaks
          chmod +x "$HOME/.local/bin/gitleaks"; rm -f "$HOME/.local/bin/gitleaks.tar.gz"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Solidity compiler used by fixture
        run: |
          solc-select install 0.8.20
          solc-select use 0.8.20
      - name: Verify mature security engines
        run: |
          slither --version
          forge --version
          halmos --version
          ityfuzz --version
          osv-scanner --version
          gitleaks version
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run production engine self-test
        run: python scripts/live_engine_self_test.py
      - name: Run executable local protocol fixture benchmark
        run: python benchmarks/run_protocol_fixtures.py
      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q
