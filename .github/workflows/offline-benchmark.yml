name: Offline vulnerability benchmark

on:
  push:
    paths:
      - 'benchmarks/**'
      - 'tests/**'
      - '*.py'
      - '.github/workflows/offline-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Bootstrap mature engines using the production installation path
        shell: bash
        run: |
          set -euo pipefail
          bash render_build.sh
          echo "$PWD/.render-foundry/bin" >> "$GITHUB_PATH"
          echo "$PWD/.render-tools/bin" >> "$GITHUB_PATH"
          echo "$PWD/.render-ityfuzz/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.ityfuzz/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/.render-foundry/bin:$PWD/.render-tools/bin:$PWD/.render-ityfuzz/bin:$HOME/.local/bin:$HOME/.ityfuzz/bin:$PATH"
          forge --version
          slither --version
          halmos --version
          ityfuzz --version
      - name: Compile project
        run: python -m compileall -q .
      - name: Run semantic, attribution, historical pipeline, candidate-triage, and protocol-validation regression tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests/test_advanced_analyzer.py tests/test_evidence_attribution.py tests/test_research_pipeline.py tests/test_historical_intelligence.py tests/test_historical_pipeline_path.py tests/test_candidate_triage.py tests/test_protocol_validation.py tests/test_execution_reproduction.py tests/test_protocol_quality_benchmark.py
      - name: Run known offline benchmark
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python benchmarks/run_benchmark.py
      - name: Run unseen holdout benchmark
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python benchmarks/run_holdout.py
      - name: Run protocol validation effectiveness benchmark
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python benchmarks/run_protocol_quality.py
      - name: Run executable local protocol fixture benchmark with real engines
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python benchmarks/run_protocol_fixtures.py
      - name: Run focused ItyFuzz reentrancy fixture
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python benchmarks/run_ityfuzz_focused.py
      - name: Verify real engine evidence registry -> reproduction -> report path
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python benchmarks/verify_real_engine_evidence.py
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web3-bughunter-offline-benchmark
          path: benchmarks/results/
          if-no-files-found: warn
