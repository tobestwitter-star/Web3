name: Offline vulnerability benchmark

on:
  push:
    paths:
      - 'benchmarks/**'
      - 'tests/**'
      - '*.py'
      - '.github/workflows/offline-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install optional mature security analyzers
        continue-on-error: true
        run: |
          python -m pip install slither-analyzer eth-wake
          python -m pip install setuptools "pytest>=8,<9"
          echo "slither=$(command -v slither || true)"
          echo "wake=$(command -v wake || true)"
      - name: Compile project
        run: python -m compileall -q .
      - name: Run semantic, attribution, historical pipeline, candidate-triage, and protocol-validation regression tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests/test_advanced_analyzer.py tests/test_evidence_attribution.py tests/test_research_pipeline.py tests/test_historical_intelligence.py tests/test_historical_pipeline_path.py tests/test_candidate_triage.py tests/test_protocol_validation.py tests/test_execution_reproduction.py tests/test_protocol_quality_benchmark.py
      - name: Run known offline benchmark
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python benchmarks/run_benchmark.py
      - name: Run unseen holdout benchmark
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python benchmarks/run_holdout.py
      - name: Run protocol validation effectiveness benchmark
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python benchmarks/run_protocol_quality.py
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: web3-bughunter-offline-benchmark
          path: benchmarks/results/
