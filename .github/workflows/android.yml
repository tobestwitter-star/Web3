name: Android client

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.10.2
      - name: Generate ephemeral release signing keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-signing
          SIGNING_PASSWORD="$(openssl rand -hex 32)"
          keytool -genkeypair -v \
            -keystore .ci-signing/release.keystore \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -alias web3-bughunter-release \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Web3 BugHunter, OU=Android, O=Web3 BugHunter, L=Online, ST=NA, C=NG" \
            -noprompt
          echo "ANDROID_SIGNING_STORE_FILE=$GITHUB_WORKSPACE/android/.ci-signing/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_STORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KEY_ALIAS=web3-bughunter-release" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew test
      - name: Release APK
        run: ./gradlew assembleRelease
      - name: Verify signed release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          test "$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -c '^Signer #1 certificate DN:')" -eq 1
          sha256sum "$APK"
          stat -c 'size_bytes=%s' "$APK"
          file "$APK"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: web3-bughunter-signed-release-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Clean signing material
        if: always()
        shell: bash
        run: rm -rf .ci-signing
# Release signing is ephemeral to the CI execution environment; no private key is committed or uploaded.
