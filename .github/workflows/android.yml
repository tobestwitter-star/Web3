name: Android client

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.10.2
      - name: Unit tests
        run: ./gradlew test
      - name: Release APK
        run: ./gradlew assembleRelease
      - name: Verify release APK
        run: |
          test -n "$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          find app/build/outputs/apk/release -type f -name '*.apk' -print
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web3-bughunter-release-apk
          path: android/app/build/outputs/apk/release/*.apk
# Push and pull-request validation keeps Android builds reproducible.
# Release artifacts are built from the canonical production backend configuration.
