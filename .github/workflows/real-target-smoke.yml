name: Real target smoke test

on:
  push:
    paths:
      - 'scripts/real_target_smoke.py'
      - 'bounty_engine.py'
      - 'research_pipeline.py'
      - 'advanced_web3_analyzer.py'
      - 'security_toolchain.py'
      - 'target_resolution.py'
      - 'protocol_research.py'
      - 'historical_intelligence.py'
      - 'economic_analysis.py'
      - 'exploit_harness.py'
      - 'evidence_classifier.py'
      - 'requirements.txt'
      - '.github/workflows/real-target-smoke.yml'
  workflow_dispatch:

jobs:
  ens-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Web3 BugHunter dependencies
        run: python -m pip install -r requirements.txt
      - name: Install optional local analyzers
        continue-on-error: true
        run: |
          python -m pip install slither-analyzer eth-wake
      - name: Run real public bounty target smoke test
        run: python scripts/real_target_smoke.py
      - name: Upload real target result
        uses: actions/upload-artifact@v4
        with:
          name: ens-real-target-result
          path: real_target_result.json
